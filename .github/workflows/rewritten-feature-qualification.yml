name: Rewritten feature qualification

on:
  push:
    branches: [evolved-lives-sensors-distillation]
    paths:
      - benchmarks/history-equivalence-20261025.json
      - .github/workflows/rewritten-feature-qualification.yml
  workflow_dispatch:

jobs:
  historical-native-subject:
    name: Fresh native qualification (${{ matrix.subject }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        subject: [evolved-lives-crowded-sensors, evolved-lives-sensor-ray-reuse]
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bind the exact rewritten subject and baseline
        id: mapped
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("tooling/benchmarks/history-equivalence-20261025.json").read_bytes())
          subject = data["equivalentHeads"]["${{ matrix.subject }}"]
          baseline = data["commits"]["8353902e0c71b67cc23ece05ebadee694905ad37"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8") as stream:
              stream.write("subject=" + subject + "\n")
              stream.write("baseline=" + baseline + "\n")
          Path("subject-receipt.json").write_text(json.dumps({"subject": subject, "baseline": baseline}))
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.mapped.outputs.subject }}
          path: subject
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subject/native -> target
      - name: Full Rust suite at the mapped experimental subject
        run: cargo test --manifest-path subject/native/Cargo.toml --release --features engine-test-hooks -- --test-threads=1
      - name: Check out the source-equivalent ray baseline
        if: matrix.subject == 'evolved-lives-sensor-ray-reuse'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.mapped.outputs.baseline }}
          path: baseline
      - name: Build both identified ray comparison runners
        if: matrix.subject == 'evolved-lives-sensor-ray-reuse'
        run: |
          cargo build --manifest-path baseline/native/Cargo.toml --release --features engine-test-hooks --bin sensor-v4-qualification
          cargo build --manifest-path subject/native/Cargo.toml --release --features engine-test-hooks --bin sensor-v4-qualification
      - name: Original paired ray-reuse comparison on rewritten sources
        if: matrix.subject == 'evolved-lives-sensor-ray-reuse'
        run: >-
          python subject/scripts/qualification/compare-sensor-workloads.py
          --baseline baseline/native/target/release/sensor-v4-qualification
          --candidate subject/native/target/release/sensor-v4-qualification
          --baseline-source 00c6adb838af9ddff8fa706a23f5854bff7905587bf40a730023a15ab0675689
          --directory "${{ runner.temp }}/ray-reuse-comparison"
          --scenario P1 --workers 3 --ray-cap 512 --ray-batch 131072
          --warmup 600 --steps 1200 --environment development --deadline-seconds 900
      - name: Retain subject identity and actual comparison receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewritten-native-${{ matrix.subject }}
          path: |
            subject-receipt.json
            ${{ runner.temp }}/ray-reuse-comparison/*.json
          if-no-files-found: error
