name: Apply async controller observations patch

on:
  push:
    branches: [fix/async-controller-observations]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/async-controller-observations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - name: Apply patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_async_controller_observations.py 2>&1 | tee patch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: async-observation-patch-log
          path: patch.log
      - name: Stop on patch error
        if: steps.patch.outcome != 'success'
        run: exit 1
      - name: Remove one-shot patch machinery
        run: rm .github/scripts/apply_async_controller_observations.py .github/workflows/apply-async-controller-observations.yml
      - name: Format Rust
        run: cargo fmt --manifest-path native/Cargo.toml
      - name: Verify
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Rust tests ==='
            cargo test --manifest-path native/Cargo.toml --release --lib --features engine-test-hooks -- --test-threads=1
            echo '=== Rust fmt ==='
            cargo fmt --manifest-path native/Cargo.toml -- --check
            echo '=== Rust clippy ==='
            cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings
            echo '=== Native addon ==='
            npm --prefix native run build
            echo '=== Browser build ==='
            npm run build:client
            echo '=== Vitest ==='
            npm test -- --reporter=dot
            echo '=== TypeScript ==='
            npm run typecheck
            echo '=== ESLint ==='
            npm run lint
          } 2>&1 | tee verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: async-observation-verification
          path: verify.log
      - name: Fail on verification error
        if: steps.verify.outcome != 'success'
        run: exit 1
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Decouple routine controller observations from delivery receipts"
          git push origin HEAD:fix/async-controller-observations
