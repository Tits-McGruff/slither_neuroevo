name: Finalize async controller observations

on:
  push:
    branches: [fix/async-controller-observations]

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/async-controller-observations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - name: Apply final regressions and documentation
        run: python .github/scripts/finalize_async_controller_observations.py
      - name: Remove one-shot finalizer
        run: rm .github/scripts/finalize_async_controller_observations.py .github/workflows/finalize-async-controller-observations.yml
      - name: Format Rust
        run: cargo fmt --manifest-path native/Cargo.toml
      - name: Rust library tests
        run: cargo test --manifest-path native/Cargo.toml --release --lib --features engine-test-hooks -- --test-threads=1
      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build production native addon
        run: npm --prefix native run build
      - name: Build browser client
        run: npm run build:client
      - name: Ordinary JS/TS tests
        run: npm test -- --reporter=dot
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Commit final verified tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden asynchronous controller observation publication"
          git push origin HEAD:fix/async-controller-observations
