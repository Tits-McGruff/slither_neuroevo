name: Apply external sensing batching patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-external-sensing-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/scripts/apply_external_sensing_patch.py

      - name: Format Rust
        run: cargo fmt --manifest-path native/Cargo.toml

      - name: Test sensing helper
        run: cargo test --manifest-path native/Cargo.toml --lib independent_sensor_batch_matches_scalar_across_worker_counts

      - name: Test mixed v4 control boundary
        run: cargo test --manifest-path native/Cargo.toml --lib v4_profiles_share_neural_external_boundary_and_preserve_v1_baseline_across_workers

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-external-sensing-patch.yml .github/scripts/apply_external_sensing_patch.py
          git add native/src/engine/control.rs native/src/engine/control_phase.rs
          git commit -m "Parallelize external controller sensing"
          git push origin HEAD:main
