name: Apply Rust Clippy cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-clippy-fix.yml
      - .github/scripts/apply_clippy_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply source cleanup
        run: python .github/scripts/apply_clippy_fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path native/Cargo.toml

      - name: Verify Clippy gate
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust library tests
        run: cargo test --manifest-path native/Cargo.toml --lib

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-clippy-fix.yml .github/scripts/apply_clippy_fix.py
          git add native/src/engine/control.rs native/src/engine/frame_v1.rs native/src/engine/inference_fixture.rs native/src/engine/state.rs native/src/engine/baseline_qualification.rs
          git commit -m "Fix Rust Clippy regressions"
          git push origin HEAD:main
