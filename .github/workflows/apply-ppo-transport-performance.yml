name: Apply PPO transport performance fix

on:
  push:
    branches:
      - fix/ppo-transport-performance
    paths:
      - .github/workflows/apply-ppo-transport-performance.yml
      - .github/scripts/apply_ppo_transport_performance.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply performance correction
        run: python .github/scripts/apply_ppo_transport_performance.py

      - name: Format Rust
        run: cargo fmt --manifest-path native/Cargo.toml

      - name: Rust library tests
        run: cargo test --manifest-path native/Cargo.toml --lib

      - name: Rust lint
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Focused transport tests
        run: npx vitest run server/binarySensors.test.ts server/wsHub.priority.integration.test.ts server/rustEngine/controllerDelivery.test.ts

      - name: TypeScript against current-main baseline
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/typecheck.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          lines = [line for line in Path('/tmp/typecheck.log').read_text().splitlines() if 'error TS' in line]
          allowed = {
              "server/test/killDuringArchiveExport.ts(39,9): error TS2709: Cannot use namespace 'ExperimentalRunningAuthority' as a type.",
              "server/test/killDuringArchiveExport.ts(40,23): error TS2709: Cannot use namespace 'ExperimentalRunningAuthority' as a type.",
              "server/test/killDuringArchiveExport.ts(45,26): error TS2345: Argument of type 'unknown' is not assignable to parameter of type 'string'.",
          }
          unexpected = [line for line in lines if line not in allowed]
          if unexpected or set(lines) != allowed:
              raise SystemExit('TypeScript introduced or changed failures:\n' + '\n'.join(lines))
          print('Only the three pre-existing current-main TypeScript failures remain.')
          PY
          fi

      - name: ESLint
        run: npm run lint

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ppo-transport-performance.yml .github/scripts/apply_ppo_transport_performance.py
          git add native/src/engine/control_phase.rs server/protocol.ts server/wsHub.ts server/wsHub.priority.integration.test.ts server/binarySensors.ts server/binarySensors.test.ts
          git commit -m "Use binary sensor transport for PPO bots"
          git push origin HEAD:fix/ppo-transport-performance
