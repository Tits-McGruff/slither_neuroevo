name: CI

on:
  push:
    branches:
      - main
      - exclusive-server-mode-refactor
      - evolved-lives-sensors-distillation
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HUSKY: 0

jobs:
  node:
    name: Node tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: runner.os != 'Windows'
        run: npm ci

      - name: Install dependencies (Windows, retry transient failures)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm ci
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }
            if ($attempt -eq $maxAttempts) {
              exit $exitCode
            }
            Write-Host "npm ci failed on attempt $attempt; retrying in 10 seconds..."
            Start-Sleep -Seconds 10
          }
      - name: Build native addon
        run: npm --prefix native run build
      - name: Verify native addon load and source identity
        run: node -e "const addon = require('./native/index.js'); if (!addon.nativeAddonBuildIdentifier?.()) throw new Error('native build identifier missing')"
      - name: Test native crate
        run: cargo test --manifest-path native/Cargo.toml --release --features engine-test-hooks -- --test-threads=1
      - name: Native baseline-v2 tactical batch
        run: >-
          cargo run --manifest-path native/Cargo.toml --release --features engine-test-hooks
          --bin baseline-v2-qualification -- --seed-count 4 --steps 180 --workers 1
          --cadence "0.016666666666666666" --output "${{ runner.temp }}/baseline-v2-tactics.json"
      - name: Retain native tactical outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-v2-tactics-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/baseline-v2-tactics.json
          if-no-files-found: warn
      - name: Native committed capture batch
        run: >-
          cargo run --manifest-path native/Cargo.toml --release --features engine-test-hooks
          --bin sensor-v4-qualification -- --scenario P0 --profile motion --bins 16 --graph modest
          --respawn on --seed 42 --workers 1 --math-backend sse2 --minimum 1 --cap 256 --batch 65536
          --baseline v2-stochastic --baseline-cadence "0.016666666666666666" --capture on
          --warmup 0 --steps 180 --workspace "${{ runner.temp }}/capture-normal-workspace"
          --output "${{ runner.temp }}/capture-normal.json"
      - name: Native slow-drain capture batch
        run: >-
          cargo run --manifest-path native/Cargo.toml --release --features engine-test-hooks
          --bin sensor-v4-qualification -- --scenario P0 --profile motion --bins 16 --graph modest
          --respawn on --seed 42 --workers 1 --math-backend sse2 --minimum 1 --cap 256 --batch 65536
          --baseline v2-stochastic --baseline-cadence "0.016666666666666666" --capture on
          --capture-drain-steps 180 --capture-queue-chunks 1 --warmup 0 --steps 180
          --workspace "${{ runner.temp }}/capture-slow-workspace" --output "${{ runner.temp }}/capture-slow.json"
      - name: Retain native capture outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/capture-normal.json
            ${{ runner.temp }}/capture-slow.json
          if-no-files-found: warn
      - name: Set up native capture qualification driver
        if: matrix.node-version == '24.x'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Native capture byte-pressure and authority cohort
        if: matrix.node-version == '24.x'
        run: >-
          python scripts/qualification/qualify-capture-pressure.py
          --executable "native/target/release/sensor-v4-qualification${{ runner.os == 'Windows' && '.exe' || '' }}"
          --directory "${{ runner.temp }}/capture-byte-pressure" --workers 3
      - name: Retain native byte-pressure evidence
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-byte-pressure-${{ matrix.os }}
          path: ${{ runner.temp }}/capture-byte-pressure/*.json
          if-no-files-found: warn
      - name: Production opaque-spool capacity smoke
        if: matrix.node-version == '24.x'
        run: >-
          node node_modules/tsx/dist/cli.mjs scripts/qualification/spool-capacity.ts
          --quota-gib 1 --object-kib 64 --objects 64
          --workspace "${{ runner.temp }}/spool-capacity-smoke-workspace"
          --output "${{ runner.temp }}/spool-capacity-smoke.json"
      - name: Retain opaque-spool smoke outcomes
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: spool-capacity-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/spool-capacity-smoke.json
          if-no-files-found: warn
      - name: Build and verify isolated release panic test addon
        run: node ./node_modules/tsx/dist/cli.mjs scripts/prepare-panic-test-addon.ts
      - name: Real-clock P0 sensor workload (measured gates are diagnostic)
        if: matrix.node-version == '24.x'
        run: >-
          node node_modules/tsx/dist/cli.mjs scripts/qualification/sensor-wall.ts
          --scenario P0 --seconds 60 --warmup-seconds 10
          --report "${{ runner.temp }}/sensor-wall-P0.json"
      - name: Real-clock P1 explicit ray candidate (measured gates are diagnostic)
        if: matrix.node-version == '24.x'
        run: >-
          node node_modules/tsx/dist/cli.mjs scripts/qualification/sensor-wall.ts
          --scenario P1 --seconds 60 --warmup-seconds 10 --ray-cap 512 --ray-batch 131072
          --report "${{ runner.temp }}/sensor-wall-P1.json"
      - name: Retain real-clock sensor outcomes
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: sensor-wall-${{ matrix.os }}
          path: ${{ runner.temp }}/sensor-wall-*.json
          if-no-files-found: warn
      - name: Build checkpoint handoff test addon
        run: cargo build --manifest-path native/Cargo.toml --features engine-test-hooks
      - name: Expose isolated checkpoint handoff test addon
        run: >-
          node -e "const fs = require('node:fs'); const lib = process.platform === 'win32' ? 'slither_native.dll' : 'libslither_native.so'; fs.copyFileSync('native/target/debug/' + lib, 'native/target/ci-handoff-hooks.node')"
      - name: Rust background generation and SQLite handoff
        env:
          SLITHER_STAGE3_CHECKPOINT_TEST_ADDON: native/target/ci-handoff-hooks.node
        run: node node_modules/vitest/vitest.mjs run server/rustEngine/checkpointPersistence.native.test.ts --reporter=dot --testTimeout=15000
      - name: Build browser client
        run: npm run build:client
      - name: Required native authority and calculation-worker contracts
        run: npm run test:native-required -- --reporter=dot
      - name: Unit tests
        run: npm run test:unit -- --reporter=dot
      - name: Component tests
        run: npm run test:component -- --reporter=dot
      - name: Integration tests
        run: npm run test:integration -- --reporter=dot
      - name: System tests
        run: npm run test:system -- --reporter=dot
      - name: Acceptance tests
        run: npm run test:acceptance -- --reporter=dot
      - name: Regression tests
        run: npm run test:regression -- --reporter=dot
      - name: Security tests
        run: npm run test:security -- --reporter=dot
      - name: Performance measurements (informational)
        continue-on-error: true
        run: npm run test:performance -- --reporter=dot
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  rust_lint:
    name: Rust fmt and clippy (native crate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - name: Replay fixture harness format
        run: cargo fmt --manifest-path ../scripts/qualification/teacher-replay-fixture/Cargo.toml -- --check
      - name: Replay fixture harness Clippy
        run: cargo clippy --locked --manifest-path ../scripts/qualification/teacher-replay-fixture/Cargo.toml --target-dir target -- -D warnings
