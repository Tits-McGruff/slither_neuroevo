name: CI

on:
  push:
    branches: [main, evolved-lives-sensors-distillation]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '24'}
          - {os: ubuntu-latest, node: '26'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - name: Reject compressed source and large generated files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for name in subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0"):
              if not name:
                  continue
              path = Path(name)
              if name.endswith((".py.gz", ".rs.gz", ".ts.gz")) or path.stat().st_size > 2 * 1024**2:
                  raise SystemExit("Generated payload/source archive must stay outside Git: " + name)
              if name.startswith("docs/performance/") and path.suffix not in (".md", ".json"):
                  raise SystemExit("Keep only compact performance metadata in Git: " + name)
          PY

      - name: Build and load production native addon
        run: npm --prefix native run build
      - run: node -e "const a=require('./native'); if(a.nativeAddonBuildClass()!=='production') throw Error('production addon required')"
      - name: Rust library tests
        if: matrix.node == '24'
        run: cargo test --manifest-path native/Cargo.toml --release --lib --features engine-test-hooks -- --test-threads=1
      - name: Ordinary test suites
        if: matrix.node == '24'
        run: npm test -- --reporter=dot
      - name: Node compatibility tests
        if: matrix.node == '26'
        run: npm run test:unit -- --reporter=dot
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:client
      - uses: actions/setup-python@v6
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          python-version: '3.12'
      - name: Regenerate shared contracts
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          python -m pip install './contracts[dev]'
          python contracts/generate.py
          git diff --exit-code -- contracts
      - name: Python benchmark helper unit tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: python -m unittest discover -s scripts/qualification -p 'test_*.py'
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --features engine-test-hooks,contract-schema -- -D warnings
