name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  HUSKY: 0

jobs:
  node:
    name: Node tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - name: Build native addon
        run: npm --prefix native run build
      - name: Verify native addon load and source identity
        run: node -e "const addon = require('./native/index.js'); if (!addon.nativeAddonBuildIdentifier?.()) throw new Error('native build identifier missing')"
      - name: Test native crate
        run: cargo test --manifest-path native/Cargo.toml --release
      - run: npm run build:client
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:js

  rust_lint:
    name: Rust fmt and clippy (native crate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
